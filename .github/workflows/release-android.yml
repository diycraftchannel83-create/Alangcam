name: CamRiderPro Android Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional version name (for example 1.0.5). Leave blank to auto-increment."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: alangcam-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build signed APK and AAB with diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Increment Android release version
        id: bump
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path

          gradle_file = Path("app/build.gradle.kts")
          text = gradle_file.read_text()
          code_match = re.search(r"(?m)^\\s*versionCode\\s*=\\s*(\\d+)\\s*$", text)
          name_match = re.search(r'(?m)^\\s*versionName\\s*=\\s*"([^"]+)"\\s*
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/camriderpro-release.jks"
          test -s "$RUNNER_TEMP/camriderpro-release.jks"
          chmod 600 "$RUNNER_TEMP/camriderpro-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/camriderpro-release.jks" >> "$GITHUB_ENV"

      - name: Verify keystore credentials
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS"

      - name: Generate launcher icons
        run: |
          python3 -m pip install Pillow
          python3 scripts/generate_launcher_icons.py
          test -s app/src/main/res/drawable-nodpi/ic_launcher_art.png
          test -s app/src/main/res/mipmap-mdpi/ic_launcher.png

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build signed release APK and AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/camriderpro-release.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --stacktrace :app:assembleRelease :app:bundleRelease

      - name: Collect APK, AAB, and diagnostic files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          aabs=(app/build/outputs/bundle/release/*.aab)
          mapping_file="app/build/outputs/mapping/release/mapping.txt"
          native_symbols_file="app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip"
          (( ${#apks[@]} > 0 )) || { echo "::error::Release APK was not generated"; exit 1; }
          (( ${#aabs[@]} > 0 )) || { echo "::error::Release AAB was not generated"; exit 1; }
          cp -- "${apks[0]}" release-output/CamRiderPro-release.apk
          cp -- "${aabs[0]}" release-output/CamRiderPro-release.aab
          if [[ -s "$mapping_file" ]]; then
            cp -- "$mapping_file" release-output/mapping.txt
          else
            echo "::warning::R8 mapping.txt was not generated."
          fi
          # Native symbols are optional: AGP may not emit a standalone ZIP.
          # Never let a missing optional file fail an otherwise successful APK/AAB build.
          if [[ -s "$native_symbols_file" ]]; then
            cp -- "$native_symbols_file" release-output/native-debug-symbols.zip
            echo "Native debug symbols included."
          else
            echo "::notice::No standalone native-debug-symbols.zip was generated; continuing without it."
          fi
          ls -lh release-output

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CamRiderPro-release-${{ steps.bump.outputs.version_name }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.version_name }}
          target_commitish: main
          name: CamRiderPro ${{ steps.bump.outputs.version_name }}
          generate_release_notes: true
          files: |
            release-output/*
, text)
          if not code_match or not name_match:
              raise SystemExit("Could not find versionCode/versionName in app/build.gradle.kts")

          current_code = int(code_match.group(1))
          current_name = name_match.group(1)
          tag_versions = []
          for tag in subprocess.check_output(["git", "tag", "--list"], text=True).splitlines():
              match = re.fullmatch(r"v?(\\d+)\\.(\\d+)\\.(\\d+)", tag.strip())
              if match:
                  tag_versions.append(tuple(map(int, match.groups())))
          current_match = re.fullmatch(r"v?(\\d+)\\.(\\d+)\\.(\\d+)", current_name)
          if current_match:
              tag_versions.append(tuple(map(int, current_match.groups())))
          latest = max(tag_versions, default=(1, 0, 0))

          requested = os.environ.get("REQUESTED_VERSION", "").strip()
          if requested:
              requested = requested.removeprefix("v")
              match = re.fullmatch(r"(\\d+)\\.(\\d+)\\.(\\d+)", requested)
              if not match:
                  raise SystemExit("release_tag must use semantic version format, e.g. 1.0.5")
              next_version = tuple(map(int, match.groups()))
              if next_version <= latest:
                  raise SystemExit(f"Requested version {requested} must be newer than latest release {'.'.join(map(str, latest))}")
          else:
              next_version = (latest[0], latest[1], latest[2] + 1)

          next_code = current_code + 1
          updated = re.sub(r"(?m)^(\\s*versionCode\\s*=\\s*)\\d+(\\s*)$", rf"\\g<1>{next_code}\\g<2>", text, count=1)
          updated = re.sub(r'(?m)^(\\s*versionName\\s*=\\s*")[^"]+(".*)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
