name: CamRiderPro Android Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional version name (for example 1.0.5). Leave blank to auto-increment."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: alangcam-release
  cancel-in-progress: false

jobs:
  build-release:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Increment Android release version
        id: bump
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          text = path.read_text()
          code_match = re.search(r"(?m)^\\s*versionCode\\s*=\\s*(\\d+)\\s*$", text)
          name_match = re.search(r'(?m)^\\s*versionName\\s*=\\s*"([^"]+)"\\s*$', text)
          if not code_match or not name_match:
              raise SystemExit("versionCode/versionName not found in app/build.gradle.kts")

          current_code = int(code_match.group(1))
          current_name = name_match.group(1)

          def parse_version(value):
              match = re.fullmatch(r"v?(\\d+)\\.(\\d+)\\.(\\d+)", value.strip())
              return tuple(map(int, match.groups())) if match else None

          versions = []
          for tag in subprocess.check_output(["git", "tag", "--list"], text=True).splitlines():
              parsed = parse_version(tag)
              if parsed:
                  versions.append(parsed)
          parsed_current = parse_version(current_name)
          if parsed_current:
              versions.append(parsed_current)
          latest = max(versions, default=(1, 0, 0))

          requested = os.environ.get("REQUESTED_VERSION", "").strip()
          if requested:
              next_version = parse_version(requested)
              if not next_version:
                  raise SystemExit("Use version format X.Y.Z, e.g. 1.0.5")
              if next_version <= latest:
                  raise SystemExit("Requested version must be newer than " + ".".join(map(str, latest)))
          else:
              next_version = (latest[0], latest[1], latest[2] + 1)

          version_name = ".".join(map(str, next_version))
          next_code = current_code + 1
          text = re.sub(r"(?m)^(\\s*versionCode\\s*=\\s*)\\d+\\s*$", rf"\\g<1>{next_code}", text, count=1)
          text = re.sub(r'(?m)^(\\s*versionName\\s*=\\s*")[^"]+(".*)$', rf"\\g<1>{version_name}\\g<2>", text, count=1)
          path.write_text(text)

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version_code={next_code}\\n")
              output.write(f"version_name={version_name}\\n")
          print(f"Building {version_name}, versionCode {next_code}")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore(release): bump to ${{ steps.bump.outputs.version_name }}"
          git push origin HEAD:main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub secret: $name"
              exit 1
            fi
          done

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/camriderpro-release.jks"
          test -s "$RUNNER_TEMP/camriderpro-release.jks"
          chmod 600 "$RUNNER_TEMP/camriderpro-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/camriderpro-release.jks" >> "$GITHUB_ENV"

      - name: Verify keystore
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS"

      - name: Generate launcher icons
        run: |
          python3 -m pip install Pillow
          python3 scripts/generate_launcher_icons.py
          test -s app/src/main/res/drawable-nodpi/ic_launcher_art.png
          test -s app/src/main/res/mipmap-mdpi/ic_launcher.png

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build signed release APK and AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/camriderpro-release.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --no-configuration-cache --stacktrace :app:assembleRelease :app:bundleRelease

      - name: Collect APK, AAB, and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          aabs=(app/build/outputs/bundle/release/*.aab)
          mapping="app/build/outputs/mapping/release/mapping.txt"
          symbols="app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip"
          (( ${#apks[@]} > 0 )) || { echo "::error::Release APK missing"; exit 1; }
          (( ${#aabs[@]} > 0 )) || { echo "::error::Release AAB missing"; exit 1; }
          cp -- "${apks[0]}" release-output/CamRiderPro-release.apk
          cp -- "${aabs[0]}" release-output/CamRiderPro-release.aab
          [[ ! -s "$mapping" ]] || cp -- "$mapping" release-output/mapping.txt
          [[ ! -s "$symbols" ]] || cp -- "$symbols" release-output/native-debug-symbols.zip
          ls -lh release-output

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: CamRiderPro-release-${{ steps.bump.outputs.version_name }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.version_name }}
          target_commitish: main
          name: CamRiderPro ${{ steps.bump.outputs.version_name }}
          generate_release_notes: true
          files: release-output/*
