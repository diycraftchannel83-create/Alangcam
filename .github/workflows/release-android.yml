name: CamRiderPro Android Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v1.0.1"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: alangcam-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/camriderpro-release.jks"
          test -s "$RUNNER_TEMP/camriderpro-release.jks"
          chmod 600 "$RUNNER_TEMP/camriderpro-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/camriderpro-release.jks" >> "$GITHUB_ENV"

      - name: Verify keystore credentials
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS"

      - name: Generate launcher icons from CamRider PRO artwork
        run: |
          python3 -m pip install --user Pillow
          python3 scripts/generate_launcher_icons.py
          test -s app/src/main/res/drawable-nodpi/ic_launcher_art.png
          test -s app/src/main/res/mipmap-mdpi/ic_launcher.png
          echo "Launcher resources generated successfully."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build signed release APK and AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/camriderpro-release.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --stacktrace :app:assembleRelease :app:bundleRelease

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          aabs=(app/build/outputs/bundle/release/*.aab)
          if (( ${#apks[@]} == 0 )); then
            echo "::error::Release APK was not generated"
            exit 1
          fi
          if (( ${#aabs[@]} == 0 )); then
            echo "::error::Release AAB was not generated"
            exit 1
          fi
          cp "${apks[0]}" release-output/CamRiderPro-release.apk
          cp "${aabs[0]}" release-output/CamRiderPro-release.aab
          ls -lh release-output

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CamRiderPro-release
          path: release-output/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: main
          name: CamRiderPro ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release-output/CamRiderPro-release.apk
            release-output/CamRiderPro-release.aab
