          fi
          ls -lh release-output

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CamRiderPro-release-v1.0.2
          path: release-output/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: main
          name: CamRiderPro ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release-output/*
, rf"\\g<1>{'.'.join(map(str, next_version))}\\g<2>", updated, count=1)
          gradle_file.write_text(updated)

          version_name = ".".join(map(str, next_version))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version_code={next_code}\\n")
