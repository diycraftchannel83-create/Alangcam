name: CamRiderPro Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/futuristic-hud-dashboard
      - feature/hud-led-readability
      - feature/modular-3-layer-hud
      - feature/gps-speedometer-manual-record
    paths:
      - '**.gradle'
      - '**.gradle.kts'
      - '**.kt'
      - '**.xml'
      - 'gradle/**'
      - '.github/workflows/build-apk.yml'
      - 'app/src/main/assets/CamRider PRO_ Racing Lens Icon.png'
      - 'scripts/generate_launcher_icons.py'

permissions:
  contents: read

concurrency:
  group: camriderpro-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate launcher icons from CamRider PRO artwork
        run: |
          python3 -m pip install --user Pillow
          python3 scripts/generate_launcher_icons.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate CI debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle --no-daemon --no-configuration-cache :app:assembleDebug

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CamRiderPro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
