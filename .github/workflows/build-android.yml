name: CamRiderPro Signed Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag versi GitHub Release, contoh v1.0.2'
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - 'app/build.gradle.kts'
      - '.github/workflows/build-android.yml'
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: camriderpro-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build signed APK and AAB with diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required signing secret is missing: ${name}"
              exit 1
            fi
          done

      - name: Prepare Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/camriderpro-release.jks"
          test -s "$RUNNER_TEMP/camriderpro-release.jks"
          chmod 600 "$RUNNER_TEMP/camriderpro-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/camriderpro-release.jks" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build signed release APK and App Bundle
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/camriderpro-release.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease

      - name: Collect APK, AAB, and diagnostic files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          aabs=(app/build/outputs/bundle/release/*.aab)
          mapping=(app/build/outputs/mapping/release/mapping.txt)
          native_symbols=(app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip)
          (( ${#apks[@]} > 0 )) || { echo "::error::Release APK was not generated"; exit 1; }
          (( ${#aabs[@]} > 0 )) || { echo "::error::Release AAB was not generated"; exit 1; }
          cp "${apks[0]}" release-output/CamRiderPro-release.apk
          cp "${aabs[0]}" release-output/CamRiderPro-release.aab
          if (( ${#mapping[@]} > 0 )); then
            cp "${mapping[0]}" release-output/mapping.txt
          else
            echo "::warning::R8 mapping.txt was not generated."
          fi
          if (( ${#native_symbols[@]} > 0 )); then
            cp "${native_symbols[0]}" release-output/native-debug-symbols.zip
          else
            echo "::warning::No separate native symbols ZIP was emitted; check whether dependency symbols were already stripped."
          fi
          ls -lh release-output

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CamRiderPro-signed-release-v1.0.2
          path: release-output/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release and upload APK/AAB
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: CamRiderPro ${{ inputs.release_tag || github.ref_name }}
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: main
          generate_release_notes: true
          files: |
            release-output/*
